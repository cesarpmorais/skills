name: Skill evals

on:
  push:
    branches: [main]
    paths:
      - "**/evals/evals.json"
      - "**/SKILL.md"
      - "run_evals.py"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "**/evals/evals.json"
      - "**/SKILL.md"
      - "run_evals.py"
      - ".github/workflows/evals.yml"
  workflow_dispatch: {}

concurrency:
  group: skill-evals-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cheap/fast tier — the Codex-side equivalent of Claude Haiku for trigger
  # evals. Must be a slug this Codex build knows natively, else it warns
  # "Model metadata not found, defaulting to fallback" and runs slower on
  # generic settings. Recognized slugs in codex 0.144.0: gpt-5.2, gpt-5.4,
  # gpt-5.4-mini, gpt-5.5, gpt-5.6-{luna,sol,terra}. Re-check when bumping the CLI.
  EVAL_MODEL: gpt-5.4-mini

jobs:
  # Decide which skills need evaluating, and emit the list as a JSON array so the
  # eval job can fan out over it as a matrix.
  select:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.select.outputs.skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history so we can diff against the base commit

      - name: Select which skills to eval
        id: select
        # Only re-run a skill's evals when THAT skill changed (its SKILL.md or
        # evals/). If shared infra changed (run_evals.py or this workflow), or we
        # have no diff base (manual run / new branch), run every skill that has
        # an eval set.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -e
          all_skills() {
            for j in */evals/evals.json; do dirname "$(dirname "$j")"; done | sort -u | xargs
          }
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push)         base="$PUSH_BEFORE" ;;
          esac
          if [ -z "$base" ] || ! git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "No usable diff base (manual run / new branch) -> running all skills."
            skills="$(all_skills)"
          else
            changed="$(git diff --name-only "$base" HEAD)"
            echo "Changed files:"; echo "$changed" | sed 's/^/  /'
            if echo "$changed" | grep -qE '^(run_evals\.py|\.github/workflows/evals\.yml)$'; then
              echo "Shared infra changed -> running all skills."
              skills="$(all_skills)"
            else
              picked=""
              for s in $(echo "$changed" | grep -E '^[^/]+/(SKILL\.md|evals/)' | cut -d/ -f1 | sort -u); do
                [ -f "$s/evals/evals.json" ] && picked="$picked $s"
              done
              skills="$(echo $picked | xargs || true)"
            fi
          fi
          # Split explicitly rather than relying on unquoted word-splitting, so the
          # matrix gets ["a","b"] and never a single ["a b"] element.
          read -ra skill_arr <<< "$skills"
          skills_json="$(jq -n -c --args '$ARGS.positional' -- "${skill_arr[@]}")"
          echo "skills=$skills_json" >> "$GITHUB_OUTPUT"
          echo "Will eval: $skills_json"

  # One job per skill, in parallel. Running them sequentially in a single job blew
  # past the 30-minute limit once the library reached 4 skills: ~40 cases x 3 trials
  # x ~21s is over 40 minutes of wall clock. Fanning out keeps each job near the
  # slowest single skill instead of the sum of all of them.
  evals:
    needs: select
    if: needs.select.outputs.skills != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false  # one skill failing must not cancel the others' results
      matrix:
        skill: ${{ fromJSON(needs.select.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Log in to Codex (headless, API key)
        env:
          # Add this as a repo secret: Settings -> Secrets and variables -> Actions.
          # This is an OpenAI API key (from platform.openai.com), not a Claude token.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Install repo skills so Codex can load them
        # The eval runs each trial in an isolated empty tempdir, so Codex only sees
        # user-level skills — and its user-level dir is $HOME/.agents/skills (per
        # https://learn.chatgpt.com/docs/build-skills). Without this, the skill under
        # test is never loaded: the agent builds instead of triggering, which both
        # fails the eval and makes it slow. Install ALL repo skills (not just the one
        # under test) to match the "whole library loaded" practice — it catches cross
        # over-triggering between skills.
        #
        # COPY, don't symlink. Under --dangerously-bypass-approvals-and-sandbox the
        # agent can write anywhere, and a symlink would let it edit the real checkout:
        # this actually happened — an agent "solved" a failing neg- case by rewriting
        # the tracked SKILL.md instead of doing the task. A copy keeps that damage
        # confined to a throwaway directory.
        run: |
          rm -rf "$HOME/.agents/skills"
          mkdir -p "$HOME/.agents/skills"
          for skill_md in */SKILL.md; do
            skill="$(dirname "$skill_md")"
            cp -R "$PWD/$skill" "$HOME/.agents/skills/$skill"
          done
          ls -la "$HOME/.agents/skills"

      - name: Run evals for ${{ matrix.skill }}
        env:
          PYTHONUNBUFFERED: "1"  # stream per-trial progress live into the CI log
        run: |
          # --dangerously-bypass-approvals-and-sandbox: the Actions runner is already
          #   an isolated ephemeral VM, and Codex's own bubblewrap sandbox can't set
          #   up its network namespace there ("bwrap: loopback: Failed RTM_NEWADDR:
          #   Operation not permitted"), which blocked the agent from writing files.
          #   Bypassing the inner sandbox lets it actually act (and removes the retry
          #   hangs). See the README for what this costs in isolation guarantees.
          # --skip-git-repo-check: each trial runs in a fresh, empty tempdir (by
          #   design, for a clean workspace), never a git repo.
          python3 run_evals.py "${{ matrix.skill }}" --trials 3 \
            --harness-cmd "codex exec --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check -m $EVAL_MODEL {prompt}"

      - name: Verify checkout stayed clean
        if: always()
        # Tripwire for the copy-not-symlink measure above. The sandbox bypass means
        # "workspace_clean" only proves the agent didn't write in the tempdir being
        # watched — not that it didn't write anywhere. If it reached tracked files,
        # say so loudly rather than letting a silently-mutated skill explain a result.
        run: |
          dirty="$(git status --porcelain -- . ':(exclude)*/evals/results')"
          if [ -n "$dirty" ]; then
            echo "::warning::Tracked files changed during the eval run — an agent wrote outside its tempdir. Results above may not reflect the committed skills."
            echo "$dirty"
          else
            echo "Checkout clean — no agent wrote outside its tempdir."
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.skill }}  # must be unique per matrix job
          path: "${{ matrix.skill }}/evals/results/**"
          if-no-files-found: ignore
